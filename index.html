<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>语音记账</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="语音记账">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>语音记账</h1>
  <button id="btnSettings" class="icon-btn" aria-label="设置">⚙︎</button>
</header>

<main>
  <section class="summary" id="summary"></section>

  <section class="capture">
    <button id="btnMic" class="mic" aria-label="按一下开始说话">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
    </button>
    <p id="micHint" class="hint">点一下话筒，说：“在 Countdown 买了牛奶面包，12 块 5 纽币”</p>
    <div class="say-row">
      <input id="sayText" type="text" placeholder="或者在这里打字 / 用键盘上的🎤听写" autocomplete="off">
      <button id="btnParse" class="btn">识别</button>
    </div>
  </section>

  <form id="form" class="card" hidden>
    <div class="form-head">
      <h2 id="formTitle">确认这条记录</h2>
      <button type="button" id="btnCancel" class="link">取消</button>
    </div>
    <div class="grid">
      <label>商店<input name="store" placeholder="例如 New World"></label>
      <label>物品<input name="item" placeholder="例如 牛奶、面包"></label>
      <label>金额<input name="amount" type="number" inputmode="decimal" step="0.01" min="0" required></label>
      <div class="field">
        <span>币种</span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="currency" value="CNY"><span>¥ 人民币</span></label>
          <label><input type="radio" name="currency" value="NZD"><span>NZ$ 纽币</span></label>
        </div>
      </div>
      <label>分类<select name="category" id="catSelect"></select></label>
      <label>日期<input name="date" type="date" required></label>
      <label class="wide">原话 / 备注<input name="note"></label>
    </div>
    <button type="submit" class="btn primary block">保存</button>
  </form>

  <section>
    <div class="list-head">
      <h2>记录</h2>
      <select id="monthFilter" aria-label="月份"></select>
    </div>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>还没有记录。点上面的话筒说一句试试。</p>
  </section>
</main>

<dialog id="settings">
  <form method="dialog" class="settings">
    <h2>设置</h2>
    <label>没说币种时默认用
      <select id="setDefaultCur">
        <option value="NZD">NZ$ 纽币</option>
        <option value="CNY">¥ 人民币</option>
      </select>
    </label>
    <label>汇率：1 纽币 = ? 人民币（用于合计折算）
      <input id="setRate" type="number" step="0.0001" min="0" inputmode="decimal">
    </label>
    <div class="settings-actions">
      <button type="button" id="btnCsv" class="btn">导出 CSV（Excel）</button>
      <button type="button" id="btnBackup" class="btn">备份 JSON</button>
      <label class="btn file-btn">恢复备份<input type="file" id="fileRestore" accept="application/json,.json" hidden></label>
      <button type="button" id="btnClear" class="btn danger">清空全部记录</button>
    </div>
    <p class="small">数据只保存在这台设备的浏览器里。换手机或清理浏览器前请先“备份 JSON”。</p>
    <button value="close" class="btn primary block">完成</button>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
